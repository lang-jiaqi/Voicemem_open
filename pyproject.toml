[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemem"
version = "0.1.0"
description = "Left-brain/right-brain memory framework with an optional audio-native perception layer (scene/speaker/emotion)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lang Jiaqi" }]
keywords = ["memory", "voice", "agent", "llm", "speech", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Keep the default installation lightweight. No local speech, audio, or
# multimodal model runtime is installed by `pip install voicemem`.
dependencies = [
    "numpy",
    "openai",
    "mem0ai",
]

[project.optional-dependencies]
# Qwen2.5-Omni runtime for multimodal audio attribution.
# Model weights are resolved separately at runtime and are not bundled in the
# Python wheel.
# VoiceMem 模型系列：网关代码 + 音频运行所需的全套依赖。
# README 的第一个示例就有 ingest(audio=...)，所以这里要把 ASR/声纹/情绪那套
# 也带上 —— 之前只有 torch/transformers，装完仍然 ModuleNotFoundError: funasr。
slm = [
    "torch",
    "transformers==4.52.3",
    "accelerate",
    "qwen-omni-utils",
    "soundfile",
    "scipy",
    "funasr",             # 流式 ASR
    "torchaudio",         # funasr 内部 import 它，但自己没声明
    "modelscope",         # funasr 取模型用
    "sherpa-onnx",        # VAD + 声纹
    "sentence-transformers",   # 本地 E5（记忆向量 / slot 分类）
]

# Backward-compatible name for existing users of the old extra.
omni = [
    "voicemem[slm]",
]

audio = [
    "soundfile",
]

# finetune/ 那套训练脚本。torch 按自己的平台/CUDA 版本单独装。
finetune = [
    "ms-swift==4.5.2",
    "bitsandbytes",
]

environment = [
    "torch",
    "transformers",
    "soundfile",
    "scipy",
]

clap = [
    "torch",
    "laion-clap",
    "soundfile",
    "scipy",
]

voiceprint = [
    "sherpa-onnx",
    "funasr",
    "torchaudio",         # funasr 内部 import 它，但自己没声明
    "modelscope",
]

text = [
    "sentence-transformers",
]

wav = [
    "voicemem[text]",
    "sherpa-onnx",
    "soundfile",
    "scipy",
    "torch",
    "transformers",
]

stream = [
    "voicemem[wav]",
    "funasr",
    "torchaudio",         # funasr 内部 import 它，但自己没声明
    "modelscope",
]

all = [
    "voicemem[stream,slm,clap]",
]

web = [
    "voicemem[all]",
    "fastapi",
    "uvicorn",
]

demo = [
    "voicemem[web]",
]

[project.urls]
Homepage = "https://github.com/lang-jiaqi/Voicemem_open"
Repository = "https://github.com/lang-jiaqi/Voicemem_open"
Issues = "https://github.com/lang-jiaqi/Voicemem_open/issues"

[tool.setuptools.packages.find]
include = ["voicemem*"]

# data/ 下的 prompt 文本是运行时读的（见 leftbrain/mem0_additive_prompt_build.py），
# 不显式声明的话 wheel 里不会有，装完一调用就 FileNotFoundError。
[tool.setuptools.package-data]
"*" = ["data/*.txt", "*.txt"]
