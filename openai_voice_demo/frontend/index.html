<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>openai_voice_demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8; --card: rgba(255,255,255,0.8); --text: #1e293b; --muted: #64748b;
    --accent: #2563eb; --accent-bg: #dbeafe; --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Inter", sans-serif; background: var(--bg);
    color: var(--text); padding: 24px; max-width: 860px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; cursor: pointer;
  }
  button.secondary { background: var(--accent-bg); color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  #status { font-size: 12px; color: var(--muted); }
  #log { height: 260px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
  #log .u { color: var(--accent); }
  #log .a { color: #16a34a; }
  #log .m { color: var(--muted); font-style: italic; }
  #log .e { color: #dc2626; }
  #hits { font-size: 12px; color: var(--muted); }
  #hits li { margin-bottom: 2px; }
</style>
</head>
<body>
  <h1>openai_voice_demo</h1>
  <div class="sub">Minimal reference client for voicemem + OpenAI (pipeline / realtime). · build v4-audiodebug</div>

  <div class="card">
    <div class="row">
      <span id="status">connecting...</span>
    </div>
    <div class="row" style="margin-top:12px;">
      <button id="micBtn" disabled>Start session</button>
      <input id="textInput" type="text" placeholder="...or type instead of speaking" />
      <button id="sendTextBtn" class="secondary">Send</button>
    </div>
  </div>

  <div class="card">
    <div id="log"></div>
  </div>

  <div class="card">
    <strong style="font-size:13px;">Left brain (structured hits)</strong>
    <ul id="hits"></ul>
  </div>

  <div class="card">
    <strong style="font-size:13px;">Right brain (episodic/emotional directive)</strong>
    <div id="rightBrain" style="font-size:12px; color:var(--muted); white-space:pre-wrap;">(none yet)</div>
  </div>

<script>
(() => {
  const SAMPLE_RATE = 24000;
  const PREBUFFER_SECONDS = 0.25; // cushion to absorb network jitter before/after a gap
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  const hitsEl = document.getElementById("hits");
  const rightBrainEl = document.getElementById("rightBrain");
  const micBtn = document.getElementById("micBtn");
  const textInput = document.getElementById("textInput");
  const sendTextBtn = document.getElementById("sendTextBtn");

  let ws = null;
  let mode = "pipeline";
  // Playback and mic capture get SEPARATE AudioContexts. Load-bearing, not
  // style: the tentative-pause barge-in flow (speech_tentative handler
  // below) suspends the playback context the moment the user starts
  // talking over a reply -- if the mic's ScriptProcessorNode lived on the
  // same context, suspending would also freeze mic capture, the server
  // would stop receiving the interrupting speech, its VAD/transcription
  // could never resolve the pause, and the whole session would deadlock
  // silently.
  let playCtx = null;
  let micCtx = null;
  let micStream = null;
  let micProcessor = null;
  let recording = false;
  let nextPlayTime = 0;
  let answerLine = null;
  let partialLine = null;
  let scheduledSources = [];
  // Caption/voice sync: reply text deltas arrive 1-2s before the TTS call's
  // first audio byte (the TTS API's real time-to-first-byte floor). Hold the
  // text until this turn's first audio chunk arrives so captions and voice
  // start together, instead of the text visibly "waiting for the sound".
  let pendingAnswerText = "";
  let answerAudioStarted = false;
  let audioBytesTotal = 0;      // on-page audio diagnostics, see ws.onmessage
  let lastAudioDebugMs = 0;

  function log(cls, text) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => { statusEl.textContent = "connected"; };
    ws.onclose = () => { statusEl.textContent = "disconnected"; micBtn.disabled = true; };
    ws.onerror = () => { statusEl.textContent = "error"; };

    ws.onmessage = (evt) => {
      if (evt.data instanceof ArrayBuffer) {
        // First audio chunk of this reply: release the held caption text so
        // captions and voice START together (see the answer_delta handler --
        // text generation runs 1-2s ahead of the TTS call's first byte, and
        // showing text that far before any sound felt broken in real use).
        if (!answerAudioStarted) {
          answerAudioStarted = true;
          if (answerLine && pendingAnswerText) {
            answerLine.textContent += pendingAnswerText;
            pendingAnswerText = "";
          }
        }
        // On-page audio diagnostics -- "no sound" reports kept needing the
        // user to open the dev console; surface the three facts that
        // localize any playback failure (are frames arriving / is the
        // context running / did playPcm throw) right in the status line.
        audioBytesTotal += evt.data.byteLength;
        try {
          playPcm(evt.data);
        } catch (e) {
          log("e", "playPcm error: " + e);
        }
        const nowMs = Date.now();
        if (nowMs - lastAudioDebugMs > 500) {
          lastAudioDebugMs = nowMs;
          statusEl.textContent = `audio ${(audioBytesTotal / 1000).toFixed(0)}KB` +
            ` ctx=${playCtx ? playCtx.state : "none"} queued=${scheduledSources.length}`;
        }
        return;
      }
      const msg = JSON.parse(evt.data);
      handleMessage(msg);
    };
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case "session_ready":
        mode = msg.mode;
        statusEl.textContent = `mode=${msg.mode} audio_native=${msg.audio_native}`;
        micBtn.textContent = "Start session";
        micBtn.disabled = false;
        break;
      case "partial_transcript":
        // Live streaming ASR -- one growing line per turn, replaced by the
        // final "you: ..." line once user_transcript arrives. Two shapes:
        // append-style deltas (realtime mode / older cloud path), or
        // replace-style full text (`replace: true` -- pipeline mode's local
        // streaming ASR, whose greedy decoder can revise earlier words, so
        // the whole line is resent each time instead of appended).
        if (!partialLine) partialLine = log("m", "you (listening): ");
        if (msg.replace) {
          partialLine.textContent = "you (listening): " + msg.text;
        } else {
          partialLine.textContent += msg.text;
        }
        break;
      case "user_transcript":
        if (partialLine) { partialLine.remove(); partialLine = null; }
        log("u", "you: " + msg.text);
        break;
      case "memory_hits":
        hitsEl.innerHTML = "";
        (msg.left_brain || []).forEach(h => {
          const li = document.createElement("li");
          li.textContent = `[${h.score?.toFixed?.(2) ?? ""}] ${h.text}`;
          hitsEl.appendChild(li);
        });
        // right_brain_hits is voicemem's structured top-5 (each tagged with
        // its source: response_experience/situation_pattern/relation/
        // emotion_trait/profile/current_signal); fall back to the
        // pre-rendered right_brain text block for older payload shapes.
        if (msg.right_brain_hits && msg.right_brain_hits.length) {
          rightBrainEl.textContent = msg.right_brain_hits
            .map(h => `[${h.source}] ${h.content}`)
            .join("\n");
        } else {
          rightBrainEl.textContent = msg.right_brain || "(none yet)";
        }
        break;
      case "answer_start":
        // Safety net: never start a new reply with the context still
        // suspended from an unresolved tentative pause.
        if (playCtx && playCtx.state === "suspended") playCtx.resume();
        answerLine = log("a", "assistant: ");
        pendingAnswerText = "";
        answerAudioStarted = false;
        break;
      case "answer_delta":
        // Held until this turn's first audio chunk arrives (see ws.onmessage)
        // so captions don't run 1-2s ahead of the voice.
        if (answerAudioStarted) {
          if (answerLine) answerLine.textContent += msg.text;
        } else {
          pendingAnswerText += msg.text;
        }
        break;
      case "answer_done":
        // Flush any still-held text (e.g. a turn whose audio never arrived).
        if (answerLine && pendingAnswerText) {
          answerLine.textContent += pendingAnswerText;
          pendingAnswerText = "";
        }
        answerLine = null;
        break;
      case "speech_tentative":
        // The user (probably) started talking -- if a reply is still
        // audibly playing, pause it NOW so the assistant goes quiet the
        // moment they open their mouth, instead of talking over them until
        // the server can confirm real speech (transcription deltas only
        // arrive after the utterance ends). Reversible: answer_resume
        // un-pauses if it turns out to be noise/echo, answer_interrupt
        // makes it permanent. The server sends this on EVERY speech start
        // (it can't know whether the browser is still playing buffered
        // audio -- see the barge-in comments in providers/pipeline.py), so
        // the playing-check here is what makes normal turns a no-op.
        if (isPlaying()) {
          playCtx.suspend();
          statusEl.textContent = "⏸ paused -- you're talking";
        }
        break;
      case "answer_resume":
        if (playCtx && playCtx.state === "suspended") {
          playCtx.resume();
          statusEl.textContent = "▶ resumed (that wasn't a real interruption)";
        }
        break;
      case "answer_interrupt":
        // Sent for any confirmed utterance while a tentative was pending --
        // only meaningful if there's actually still audio queued/playing.
        pendingAnswerText = "";  // held caption text of a killed reply: drop it
        if (scheduledSources.length > 0) {
          stopPlayback();
          log("m", "(interrupted)");
          statusEl.textContent = "⏹ interrupted -- answering your new message";
        }
        // Un-suspend after the flush so the NEXT reply is audible -- the
        // context was likely suspended by the speech_tentative that
        // preceded this interrupt.
        if (playCtx && playCtx.state === "suspended") playCtx.resume();
        break;
      case "error":
        log("e", "error: " + msg.message);
        break;
      default:
        log("m", JSON.stringify(msg));
    }
  }

  // ---- playback: queue incoming PCM16 24kHz mono chunks for gapless playback ----
  function playPcm(arrayBuffer) {
    if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
    const int16 = new Int16Array(arrayBuffer);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

    const buffer = playCtx.createBuffer(1, float32.length, SAMPLE_RATE);
    buffer.copyToChannel(float32, 0);

    const source = playCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(playCtx.destination);
    scheduledSources.push(source);
    source.onended = () => {
      const i = scheduledSources.indexOf(source);
      if (i !== -1) scheduledSources.splice(i, 1);
    };

    const now = playCtx.currentTime;
    // If we've caught up to (or fallen behind) the live edge, re-apply a
    // prebuffer cushion instead of resuming exactly at `now` -- with zero
    // slack, the very next chunk arriving even slightly late would glitch
    // again immediately. This makes playback self-healing after a stall
    // instead of stuttering repeatedly.
    const startAt = nextPlayTime > now ? nextPlayTime : now + PREBUFFER_SECONDS;
    source.start(startAt);
    nextPlayTime = startAt + buffer.duration;
  }

  // "Still audibly playing (or paused mid-reply with audio left)": there are
  // scheduled sources that haven't finished. This is the client-side truth
  // the server doesn't have -- TTS audio arrives much faster than real-time,
  // so the server's own turn task usually finishes while several seconds of
  // audio are still queued here.
  function isPlaying() {
    return playCtx !== null && scheduledSources.length > 0 && playCtx.state === "running";
  }

  // Barge-in: stop everything queued/playing immediately and reset the
  // scheduling clock so the *next* response's audio starts fresh instead of
  // being scheduled after now-cancelled leftover audio.
  function stopPlayback() {
    for (const s of scheduledSources.splice(0)) {
      try { s.stop(); } catch (e) { /* already ended */ }
    }
    if (playCtx) nextPlayTime = playCtx.currentTime;
  }

  // ---- mic capture: resample to 24kHz PCM16, send as binary WS frames ----
  function downsample(float32, fromRate, toRate) {
    if (fromRate === toRate) return float32;
    const ratio = fromRate / toRate;
    const outLength = Math.round(float32.length / ratio);
    const out = new Float32Array(outLength);
    for (let i = 0; i < outLength; i++) {
      const srcIdx = i * ratio;
      const i0 = Math.floor(srcIdx);
      const i1 = Math.min(i0 + 1, float32.length - 1);
      const frac = srcIdx - i0;
      out[i] = float32[i0] * (1 - frac) + float32[i1] * frac;
    }
    return out;
  }

  function floatTo16BitPCM(float32) {
    const out = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      const s = Math.max(-1, Math.min(1, float32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  // Local barge-in threshold. Loose default (untuned per-mic/room) -- the
  // point isn't perfect VAD, it's *not waiting on a network round trip* to
  // react to the user's own mic. False positives just cost a brief audible
  // gap (playback resumes on the next real delta if the server didn't also
  // cancel); missed positives fall back to the normal server-confirmed path.
  const VAD_RMS_THRESHOLD = 0.03;

  function computeRms(float32) {
    let sum = 0;
    for (let i = 0; i < float32.length; i++) sum += float32[i] * float32[i];
    return Math.sqrt(sum / float32.length);
  }

  async function startMic() {
    // Explicit echoCancellation: pipeline mode is now continuous-listening
    // (no push-to-talk) with server-side barge-in -- without the browser's
    // own acoustic echo cancellation, the assistant's own TTS coming out of
    // the speakers gets picked back up by the still-open mic and can trigger
    // a false speech_started, which cancels the very turn that's playing,
    // producing a self-interrupt loop (real symptom reported: "no sound" --
    // every turn gets cut before it's audible). AEC is usually on by default,
    // but relying on that default silently broke; being explicit here is the
    // fix. This still isn't 100% -- headphones remain the reliable way to
    // eliminate acoustic echo entirely, unlike software AEC.
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    if (!micCtx) micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = micCtx.createMediaStreamSource(micStream);
    // ScriptProcessorNode is deprecated but keeps this a single dependency-free
    // file (no AudioWorklet module to load separately).
    micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
    const silentGain = micCtx.createGain();
    silentGain.gain.value = 0; // graph must reach destination to keep firing, but stay silent
    micProcessor.onaudioprocess = (e) => {
      if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);

      // Local barge-in: mute playback the instant OUR OWN mic picks up speech
      // energy, instead of waiting for the full round trip (server VAD ->
      // cancel -> answer_interrupt back over the network/SSH tunnel). The
      // real server-side cancel still happens in parallel via the mic audio
      // we're about to send below -- this is just what makes it feel instant.
      if (mode === "realtime" && scheduledSources.length > 0 && computeRms(input) > VAD_RMS_THRESHOLD) {
        stopPlayback();
      }

      const resampled = downsample(input, micCtx.sampleRate, SAMPLE_RATE);
      const pcm16 = floatTo16BitPCM(resampled);
      ws.send(pcm16.buffer);
    };
    source.connect(micProcessor);
    micProcessor.connect(silentGain);
    silentGain.connect(micCtx.destination);
  }

  function stopMic() {
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  }

  // ---- start/stop session: both modes are now continuous-listening (no
  // push-to-talk) -- pipeline mode streams mic audio into an OpenAI Realtime
  // transcription-only session server-side (see providers/pipeline.py),
  // realtime mode into the full speech-to-speech session; either way the
  // server's own VAD decides turn boundaries, the client just streams. ----
  micBtn.addEventListener("click", async () => {
    if (!recording) {
      await startMic();
      recording = true;
      micBtn.textContent = "Stop session";
    } else {
      recording = false;
      stopMic();
      micBtn.textContent = "Start session";
    }
  });

  sendTextBtn.addEventListener("click", () => {
    const text = textInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "user_text", text }));
    textInput.value = "";
  });
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendTextBtn.click();
  });

  connect();
})();
</script>
</body>
</html>
