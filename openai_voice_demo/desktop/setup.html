<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>VoiceMem setup</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 26px 28px;
         background: #0f1115; color: #e8ecf5; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p  { font-size: 12.5px; color: #9aa1b0; line-height: 1.5; margin: 0 0 16px; }
  input { width: 100%; box-sizing: border-box; font-size: 14px; padding: 9px 10px;
          border: 1px solid #333a46; border-radius: 7px; background: #171a20;
          color: #e8ecf5; font-family: ui-monospace, monospace; }
  button { margin-top: 16px; width: 100%; font-size: 14px; padding: 10px;
           border: 0; border-radius: 7px; background: #4aa8f0; color: #fff;
           cursor: pointer; }
  button:disabled { background: #33465a; cursor: default; }
  a { color: #4aa8f0; }
</style>
</head>
<body>
  <h1>输入 OpenAI API Key</h1>
  <p>VoiceMem 在本机运行，但回复 / 语音合成 / 记忆抽取仍会调用 OpenAI。
     密钥只保存在本机（userData/config.json），不会上传。
     没有的话到 <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com</a> 获取。</p>
  <input id="key" type="password" placeholder="sk-..." autofocus />
  <button id="go" disabled>开始使用</button>

  <script>
    const key = document.getElementById("key");
    const go  = document.getElementById("go");
    const sync = () => (go.disabled = key.value.trim().length < 10);
    key.addEventListener("input", sync);
    key.addEventListener("keydown", (e) => { if (e.key === "Enter" && !go.disabled) go.click(); });
    go.addEventListener("click", () => { go.disabled = true; window.setup.save(key.value); });
  </script>
</body>
</html>
