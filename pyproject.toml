[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemem"
version = "0.1.0"
description = "Left-brain/right-brain memory framework with an optional audio-native perception layer (scene/speaker/emotion)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lang Jiaqi" }]

# Keep the default installation lightweight. No local speech, audio, or
# multimodal model runtime is installed by `pip install voicemem`.
dependencies = [
    "numpy",
    "openai",
    "mem0ai",
]

[project.optional-dependencies]
# Qwen2.5-Omni runtime for multimodal audio attribution.
# Model weights are resolved separately at runtime and are not bundled in the
# Python wheel.
slm = [
    "torch",
    "transformers==4.52.3",
    "accelerate",
    "qwen-omni-utils",
    "soundfile",
]

# Backward-compatible name for existing users of the old extra.
omni = [
    "voicemem[slm]",
]

audio = [
    "soundfile",
]

environment = [
    "torch",
    "transformers",
    "soundfile",
    "scipy",
]

clap = [
    "torch",
    "laion-clap",
    "soundfile",
    "scipy",
]

voiceprint = [
    "sherpa-onnx",
    "funasr",
    "modelscope",
]

text = [
    "sentence-transformers",
]

wav = [
    "voicemem[text]",
    "sherpa-onnx",
    "soundfile",
    "scipy",
    "torch",
    "transformers",
]

stream = [
    "voicemem[wav]",
    "funasr",
    "modelscope",
]

all = [
    "voicemem[stream,slm,clap]",
]

web = [
    "voicemem[all]",
    "fastapi",
    "uvicorn",
]

demo = [
    "voicemem[web]",
]

[tool.setuptools.packages.find]
include = ["voicemem*"]
